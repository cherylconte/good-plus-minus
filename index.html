<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Base-10 Place Value Tool</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f9f9f9;
  text-align:center;
}

#controls {
  margin:15px;
}

input, button {
  font-size:16px;
  padding:5px 10px;
}

/* ✅ SCALE CONTROL */
:root {
  --scale: 0.6;
}

#availableBlocks {
  display:flex;
  justify-content:center;
  gap:15px;
  margin:20px;
}

/* GENERAL BLOCK */
.block {
  cursor:pointer;
  user-select:none;
  border-radius:4px;
}

/* SCALED SIZES */
.flat {
  width: calc(200px * var(--scale));
  height: calc(200px * var(--scale));
}

.rod {
  width: calc(20px * var(--scale));
  height: calc(200px * var(--scale));
}

.unit {
  width: calc(20px * var(--scale));
  height: calc(20px * var(--scale));
}

/* PALETTE */
.palette {
  background:#9e9e9e;
}

/* ROW COLORS */
.row1 .flat, .row1 .rod, .row1 .unit { background:#1e88e5; }
.row2 .flat, .row2 .rod, .row2 .unit { background:#e53935; }

#board {
  display:flex;
  gap:20px;
  border:2px solid #333;
  background:white;
  padding:20px;
  margin:20px;
}

.column {
  flex:1;
  border-left:1px solid #333;
  min-height:260px;
  position:relative;
  padding-top:30px;
}

.column:first-child { border-left:none; }

.column-label {
  position:absolute;
  top:0;
  width:100%;
  font-weight:bold;
}

.row-blocks {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:10px;
}

#equation {
  font-size:40px;
  margin-top:30px;
}
</style>
</head>

<body>

<h2>Base-10 Addition / Subtraction</h2>

<div id="controls">
  <input id="problemInput" value="246 + 175">
  <button id="setup">Set Up</button>
  <button id="switchRow">Switch Number</button>
  <button id="undo">Undo</button>
</div>

<div id="availableBlocks">
  <div class="block flat palette"></div>
  <div class="block rod palette"></div>
  <div class="block unit palette"></div>
</div>

<div id="board">
  <div class="column" id="hundredsCol">
    <div class="column-label">Hundreds</div>
  </div>
  <div class="column" id="tensCol">
    <div class="column-label">Tens</div>
  </div>
  <div class="column" id="onesCol">
    <div class="column-label">Ones</div>
  </div>
</div>

<div id="equation"></div>

<script>
const cols = {
  flat: document.getElementById('hundredsCol'),
  rod: document.getElementById('tensCol'),
  unit: document.getElementById('onesCol')
};

let currentRow = 1;

/* ✅ HISTORY STACK */
let history = [];

// Clear board
function clearBoard() {
  Object.values(cols).forEach(col => {
    const label = col.querySelector('.column-label').outerHTML;
    col.innerHTML = label;
  });
  history = [];
}

// Get or create row
function getRow(col) {
  let row = col.querySelector(`.row${currentRow}`);
  if (!row) {
    row = document.createElement('div');
    row.className = `row-blocks row${currentRow}`;
    col.appendChild(row);
  }
  return row;
}

/* ✅ ADD BLOCK (tracks history) */
function addBlock(type, track = true) {
  const block = document.createElement('div');
  block.className = `block ${type}`;

  const rowDiv = getRow(cols[type]);
  rowDiv.appendChild(block);

  if (track) {
    history.push({
      action: "add",
      blocks: [block]
    });
  }

  block.draggable = true;
  block.addEventListener('dragstart', e => {
    e.dataTransfer.setData('type', type);
    e.dataTransfer.setData('row', currentRow);
  });

  return block;
}

/* ✅ REMOVE BLOCKS */
function removeBlocks(blocks) {
  blocks.forEach(b => b.remove());
}

/* PALETTE */
document.querySelectorAll('.palette').forEach(b => {
  b.addEventListener('click', () => {
    const type = b.classList.contains('flat') ? 'flat'
      : b.classList.contains('rod') ? 'rod' : 'unit';
    addBlock(type);
  });
});

/* ✅ REGROUPING WITH SMART HISTORY */
Object.entries(cols).forEach(([type, col]) => {
  col.addEventListener('dragover', e => e.preventDefault());

  col.addEventListener('drop', e => {
    e.preventDefault();

    const fromType = e.dataTransfer.getData('type');
    const row = e.dataTransfer.getData('row');

    const targetType =
      col.id === 'hundredsCol' ? 'flat' :
      col.id === 'tensCol' ? 'rod' : 'unit';

    if (fromType === targetType) return;

    const fromCol = cols[fromType];
    const rowDiv = fromCol.querySelector(`.row${row}`);
    if (!rowDiv) return;

    const blocks = [...rowDiv.querySelectorAll(`.${fromType}`)];

    /* UNIT → ROD */
    if (fromType === 'unit' && targetType === 'rod' && blocks.length >= 10) {
      const removed = blocks.slice(0, 10);
      removeBlocks(removed);

      const newBlock = addBlock('rod', false);

      history.push({
        action: "regroup",
        removed,
        added: [newBlock]
      });
    }

    /* ROD → UNIT */
    if (fromType === 'rod' && targetType === 'unit') {
      const removed = [blocks[0]];
      removeBlocks(removed);

      const added = [];
      for (let i = 0; i < 10; i++) {
        added.push(addBlock('unit', false));
      }

      history.push({
        action: "regroup",
        removed,
        added
      });
    }

    /* ROD → FLAT */
    if (fromType === 'rod' && targetType === 'flat' && blocks.length >= 10) {
      const removed = blocks.slice(0, 10);
      removeBlocks(removed);

      const newBlock = addBlock('flat', false);

      history.push({
        action: "regroup",
        removed,
        added: [newBlock]
      });
    }

    /* FLAT → ROD */
    if (fromType === 'flat' && targetType === 'rod') {
      const removed = [blocks[0]];
      removeBlocks(removed);

      const added = [];
      for (let i = 0; i < 10; i++) {
        added.push(addBlock('rod', false));
      }

      history.push({
        action: "regroup",
        removed,
        added
      });
    }
  });
});

/* ✅ SMART UNDO */
document.getElementById('undo').onclick = () => {
  const last = history.pop();
  if (!last) return;

  if (last.action === "add") {
    removeBlocks(last.blocks);
  }

  if (last.action === "regroup") {
    // remove what was added
    removeBlocks(last.added);

    // restore what was removed
    last.removed.forEach(block => {
      const type =
        block.classList.contains('flat') ? 'flat' :
        block.classList.contains('rod') ? 'rod' : 'unit';

      const restored = addBlock(type, false);
    });
  }
};

/* SETUP */
document.getElementById('setup').onclick = () => {
  clearBoard();
  currentRow = 1;
  document.getElementById('equation').innerText =
    document.getElementById('problemInput').value + " = ____";
};

/* SWITCH ROW */
document.getElementById('switchRow').onclick = () => {
  currentRow = currentRow === 1 ? 2 : 1;
};
</script>

</body>
</html>
